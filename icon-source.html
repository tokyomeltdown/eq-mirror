<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>icon</title>
<!--
  Source for docs/icon.png. The mark is the one the plug-in draws for itself
  (PluginEditor::paintLogo): a curve, its reflection at a third of the
  strength, and the line of the mirror between them. The geometry is authored
  on a 22 x 22 grid there and scaled by 16 here.

      bash make-og.sh

  No tile behind it: EQ Mirror is a plug-in, not an app, and the mark is
  only ever shown on its own or beside the word mark.
-->
<style>
  *{margin:0;padding:0}
  html,body{width:512px;height:512px;overflow:hidden;background:transparent}
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(96 80) scale(16)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-1" y1="11" x2="21" y2="11" stroke="#3C4248" stroke-opacity=".22" stroke-width=".8"/>
    <path d="M0 13 C4 13 6 19 10 19 C14 19 16 15 20 15" stroke="#3C4248" stroke-opacity=".32" stroke-width="1.7"/>
    <path d="M0 9 C4 9 6 3 10 3 C14 3 16 7 20 7" stroke="#3C4248" stroke-width="1.7"/>
  </g>
</svg>
</body>
</html>
