<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<!--
  Source for docs/og-image.png. Rendered rather than drawn by hand so the card
  keeps the page's colours when they change.

      bash make-og.sh

  1200x630 is what the social cards crop to. Everything that has to survive a
  thumbnail sits in the middle half.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#eceef0;color:#1b1f23;position:relative;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  .glow{position:absolute;inset:0;background:radial-gradient(50% 60% at 70% 75%,rgba(200,106,79,.14),transparent 70%),radial-gradient(45% 55% at 92% 60%,rgba(47,144,136,.14),transparent 70%)}
  .left{position:absolute;left:72px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:12px;font-size:26px;letter-spacing:-.01em;margin-bottom:34px}
  .brand b{font-weight:700} .brand i{font-style:normal;opacity:.72}
  h1{font-size:62px;line-height:1;font-weight:700;letter-spacing:-.045em}
  .grad{background:linear-gradient(100deg,#d9876b 0%,#c86a4f 35%,#8f8f86 62%,#2f9088 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .line{height:1px;margin-top:16px;background:linear-gradient(90deg,rgba(60,66,72,.28),transparent)}
  .refl{font-size:62px;line-height:1;font-weight:700;letter-spacing:-.045em;transform:scaleY(-1);opacity:.26;height:36px;overflow:hidden;margin-top:4px;
    -webkit-mask-image:linear-gradient(to top,#000,transparent);filter:blur(.5px)}
  .refl span{display:block;transform:translateY(-40%)}
  .sub{margin-top:20px;font-size:21px;line-height:1.45;color:#646b73}
  .foot{margin-top:26px;font-size:16px;color:#878e96}
  .foot b{color:#1b1f23}
  .shot{position:absolute;left:640px;top:96px;width:720px;border-radius:14px;overflow:hidden;border:1px solid rgba(60,66,72,.18);
    box-shadow:0 50px 100px -30px rgba(27,31,35,.35);transform:perspective(1400px) rotateY(-14deg) rotateX(4deg);transform-origin:0 50%}
  .shot img{display:block;width:100%}
</style>
</head>
<body>
<div class="glow"></div>
<div class="left">
  <div class="brand">
    <svg width="34" height="31" viewBox="-2 0 24 22" fill="none" stroke-linecap="round" stroke="#3c4248">
      <line x1="-1" y1="11" x2="21" y2="11" stroke-opacity=".22" stroke-width=".8"/>
      <path d="M0 13 C4 13 6 19 10 19 C14 19 16 15 20 15" stroke-opacity=".32" stroke-width="1.7"/>
      <path d="M0 9 C4 9 6 3 10 3 C14 3 16 7 20 7" stroke-width="1.7"/>
    </svg>
    <span><b>EQ</b> <i>Mirror</i></span>
  </div>
  <h1>See your analog EQ<br><span class="grad">at work.</span></h1>
  <div class="line"></div>
  <div class="refl"><span>at work.</span></div>
  <p class="sub">One before your EQ, one after. Every turn of a knob, made visible.</p>
  <p class="foot">AU · VST3 · AAX &nbsp;·&nbsp; macOS 12+ &nbsp;·&nbsp; <b>$18</b></p>
</div>
<div class="shot"><img src="docs/img/hero.jpg" alt=""></div>
</body>
</html>
